# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `chat`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${API_TOKEN}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /healthz
#
# ĐIỂM CỘNG: thêm service `nginx` làm load balancer (nginx/nginx.conf đã có sẵn)
#     docker compose up --scale chat=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      # Dải cổng thay vì cổng cố định: khi `--scale chat=3`, mỗi container
      # tự nhận một cổng host khác nhau (8000, 8001, 8002) thay vì tranh
      # nhau cùng một cổng 8000 (Docker không cho 2 container bind chung
      # một cổng host). Chạy 1 container (mặc định) vẫn lên đúng cổng 8000.
      - "8000-8002:8000"
    environment:
      - API_TOKEN=${API_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - BUCKET_CAPACITY=${BUCKET_CAPACITY:-10}
      - REFILL_PER_MINUTE=${REFILL_PER_MINUTE:-10}
      - DAILY_BUDGET_USD=${DAILY_BUDGET_USD:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ĐIỂM CỘNG — load balancer thật trước cụm `chat`. Docker DNS trả về IP
  # của mọi container `chat` đang chạy cho hostname `chat`; Nginx round-robin
  # giữa chúng. Gọi qua cổng 80 để thấy 2 request liên tiếp của cùng một
  # client có thể rơi vào 2 container chat khác nhau.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat

volumes:
  redis-data:
